name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

env:
  # Keep release preparation pinned to the canonical AgentDock repository.
  RELEASE_SOURCE_REPOSITORY: Zestful-ss/agentdock

jobs:
  validate-release-source:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Validate release source
    steps:
      - name: Match the release source repository
        env:
          EXPECTED_REPOSITORY: ${{ env.RELEASE_SOURCE_REPOSITORY }}
        run: |
          set -euo pipefail
          if [ "${{ github.repository }}" != "$EXPECTED_REPOSITORY" ]; then
            echo "::error::This workflow is pinned to $EXPECTED_REPOSITORY, but the workflow was dispatched in ${{ github.repository }}. Update RELEASE_SOURCE_REPOSITORY before preparing a release from another repository."
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Prepare Release must be dispatched from main; refusing to push $GITHUB_REF directly into main."
            exit 1
          fi

  prepare-release:
    needs: validate-release-source
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare release files
        run: npm run release:prepare -- ${{ inputs.release_type }}

      - name: Verify release staging
        run: git diff --check

      - name: Commit and tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Keep the generated release set explicit. This workflow only
          # prepares the version commit/tag; the separate release.yml owns
          # build, signing, notarization, and publication.
          git add \
            CHANGELOG.md \
            CHANGELOG-zh.md \
            package.json \
            package-lock.json \
            src-tauri/tauri.conf.json \
            src-tauri/Cargo.toml \
            src-tauri/Cargo.lock \
            src/i18n/en.json \
            src/i18n/zh.json \
            assets/star-history.svg
          git diff --cached --check
          git commit -m "chore: bump version to ${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push --follow-tags origin HEAD:main
