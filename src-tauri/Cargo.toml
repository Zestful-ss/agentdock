[package]
name = "agentdock"
version = "1.40.0"
description = "AgentDock - Agent skills and MCP resource manager"
authors = ["tianliang"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
default-run = "agentdock"
autobins = false

[features]
# Historical harness-deployment tests are opt-in until legacy target rows
# are migrated. V1 CI never enables this feature.
legacy-harness-deploy-tests = []

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "agentdock"
path = "src/main.rs"

[[bin]]
name = "agentdock-cli"
path = "src/bin/agentdock-cli.rs"

# Keep the historical executable available for one compatibility window.
[[bin]]
name = "skills-manager-cli"
path = "src/bin/skills-manager-cli.rs"
test = false
bench = false

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0" }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "v7"] }
sha2 = "0.10"
dirs = "5.0"
walkdir = "2.5"
fs2 = "0.4"
unicode-normalization = "0.1"
caseless = "0.2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
anyhow = "1.0"
chrono = "0.4"
gethostname = "1"
serde_yaml = "0.9"
toml = "0.8"
git2 = { version = "0.19", features = ["vendored-openssl"] }
tokio = { version = "1", features = ["full"] }
regex = "1"
hex = "0.4"
urlencoding = "2"
zip = "2"
tempfile = "3.26.0"
aes-gcm = "0.10"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
rand = "0.8"
clap = { version = "4.5", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
junction = "2"
